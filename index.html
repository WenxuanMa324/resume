<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历 - 竞赛、论文与专利</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #16a34a;
            --warning-color: #ea580c;
            --light-gray: #f3f4f6;
            --border-color: #e5e7eb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 60px 40px;
            text-align: center;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .nav-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            background: var(--light-gray);
        }

        .tab-button {
            flex: 1;
            padding: 18px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-button:hover {
            color: var(--primary-color);
            background: rgba(37, 99, 235, 0.05);
        }

        .tab-button.active {
            color: var(--primary-color);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary-color);
        }

        .tab-content {
            display: none;
            padding: 40px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tab-content h2 {
            font-size: 2em;
            color: var(--primary-color);
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .content-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .item {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            background: white;
            transition: all 0.3s ease;
        }

        .item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.1);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-header h3 {
            font-size: 1.5em;
            color: var(--text-primary);
            flex: 1;
            margin-right: 15px;
        }

        .badge {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }

        .item-header h3 + .badge {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        .item-details {
            margin-top: 15px;
        }

        .item-description {
            color: var(--text-secondary);
            font-size: 1.05em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .status-note {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 1em;
            margin-top: 15px;
        }

        .item-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            border: 2px solid;
            cursor: pointer;
        }

        .certificate-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-color: var(--primary-color);
        }

        .certificate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }

        .project-btn {
            background: var(--light-gray);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .project-btn:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        footer {
            background: var(--light-gray);
            padding: 30px;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            header {
                padding: 40px 20px;
            }

            header h1 {
                font-size: 2em;
            }

            header .subtitle {
                font-size: 1em;
            }

            .tab-content {
                padding: 25px 20px;
            }

            .tab-content h2 {
                font-size: 1.5em;
                margin-bottom: 20px;
            }

            .item {
                padding: 20px;
            }

            .item-header {
                flex-direction: column;
                gap: 10px;
            }

            .item-header h3 {
                margin-right: 0;
            }

            .badge {
                align-self: flex-start;
            }

            .item-links {
                flex-direction: column;
                gap: 10px;
            }

            .link-button {
                width: 100%;
            }

            .nav-tabs {
                flex-direction: column;
            }

            .tab-button {
                border-bottom: 1px solid var(--border-color);
            }

            .tab-button.active::after {
                display: none;
            }

            .tab-button.active {
                background: rgba(37, 99, 235, 0.1);
                border-left: 4px solid var(--primary-color);
                padding-left: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>个人简历</h1>
            <p class="subtitle">竞赛 · 论文 · 专利</p>
        </header>

        <nav class="nav-tabs">
            <button class="tab-button active" onclick="showTab(event, 'competitions')">竞赛</button>
            <button class="tab-button" onclick="showTab(event, 'papers')">论文</button>
            <button class="tab-button" onclick="showTab(event, 'patents')">专利</button>
        </nav>

        <!-- 竞赛 Section -->
        <section id="competitions" class="tab-content active">
            <h2>竞赛获奖</h2>
            <div class="content-list">
                <div class="item">
                    <div class="item-header">
                        <h3>2026中国高校计算机大赛移动应用创新赛华南赛区一等奖</h3>
                        <span class="badge">一等奖</span>
                    </div>
                    <div class="item-details">
                        <p class="item-description">
                            在2026年中国高校计算机大赛移动应用创新赛中荣获华南赛区一等奖，项目展现了突出的技术创新和实用价值。
                        </p>
                        <div class="item-links">
                            <a href="https://share.weiyun.com/xLiyH4Ko" target="_blank" class="link-button certificate-btn">
                                📜 查看证书
                            </a>
                            <a href="https://github.com/WenxuanMa610/CardioMind-Al" target="_blank" class="link-button project-btn">
                                🚀 项目链接
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 论文 Section -->
        <section id="papers" class="tab-content">
            <h2>学术论文</h2>
            <div class="content-list">
                <div class="item">
                    <div class="item-header">
                        <h3>在投论文</h3>
                        <span class="badge">3篇</span>
                    </div>
                    <div class="item-details">
                        <p class="item-description">
                            目前有3篇学术论文正在投稿审核中，研究方向涵盖移动应用、人工智能等领域。
                        </p>
                        <p class="status-note">📋 审核中...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 专利 Section -->
        <section id="patents" class="tab-content">
            <h2>软件著作权</h2>
            <div class="content-list">
                <div class="item">
                    <div class="item-header">
                        <h3>已授权软件著作权</h3>
                        <span class="badge">4项</span>
                    </div>
                    <div class="item-details">
                        <p class="item-description">
                            已获得4项软件著作权授权，涵盖多个应用领域和技术方向。
                        </p>
                        <p class="status-note">✅ 已授权</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 个人简历. 保留所有权利。</p>
    </footer>

    <script>
        function showTab(event, tabName) {
            // 隐藏所有标签内容
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            // 移除所有按钮的活跃状态
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => {
                button.classList.remove('active');
            });

            // 显示选定的标签内容
            const selectedContent = document.getElementById(tabName);
            if (selectedContent) {
                selectedContent.classList.add('active');
            }

            // 激活对应的按钮
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
